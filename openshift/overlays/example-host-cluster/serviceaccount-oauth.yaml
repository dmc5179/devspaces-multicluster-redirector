# CHANGE ME (2 of 4): must be "https://<Route.spec.host>/oauth/callback".
#
# Keep in sync with route-host.yaml. A mismatch fails the OAuth callback.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspaces-multicluster-redirector
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.primary: "https://redirector.apps.hub.example.com/oauth/callback"
