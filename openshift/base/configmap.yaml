apiVersion: v1
kind: ConfigMap
metadata:
  name: devspaces-openshift-group-mapping
data:
  # JSON mapping between OpenShift groups and Dev Spaces URLs.
  #
  # Empty by default: this is environment-specific data, so overlays replace it
  # wholesale. See ../overlays/example-host-cluster/configmap-group-mapping.yaml.
  #
  # Keys use AND logic — a comma-separated key such as "team-alpha, team-beta"
  # requires membership in both groups.
  #
  # Kept as a plain ConfigMap rather than a configMapGenerator on purpose: the
  # generator appends a content hash to the name, which changes the volume
  # reference and rolls the pod on every edit. That would defeat the live-reload
  # in GroupMappingService, which re-reads this file on each request.
  group-mapping.json: |
    {}
