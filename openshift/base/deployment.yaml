apiVersion: apps/v1
kind: Deployment
metadata:
  name: devspaces-multicluster-redirector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devspaces-multicluster-redirector
  template:
    metadata:
      labels:
        app: devspaces-multicluster-redirector
    spec:
      serviceAccountName: devspaces-multicluster-redirector
      containers:
        - name: devspaces-multicluster-redirector
          # Overlays pin this via the kustomization `images:` field. Prefer a digest.
          image: quay.io/redhat-developer/devspaces-multicluster-redirector:latest
          ports:
            - containerPort: 8080
          # Readiness asserts the two things the app actually needs: the
          # group-mapping ConfigMap is readable, and the OpenShift groups API is
          # reachable with list permission. Both are external, so timeoutSeconds is
          # raised from the 1s default and failureThreshold absorbs transient
          # errors — with replicas: 1, flapping readiness is a user-visible outage.
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness has no dependency checks on purpose: a restart cannot fix an
          # unreachable API, and restarting on one would turn a dependency outage
          # into a CrashLoopBackOff.
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: group-mapping
              mountPath: /etc/config
              readOnly: true
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9@sha256:4da6381f4f79de6a6024554aa99129e9b79b7ad7fdde0b0bebbcb87421a97d7c
          ports:
            - containerPort: 8443
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -c
            - |
              exec /usr/bin/oauth-proxy \
                -provider=openshift \
                -http-address=:8443 \
                -https-address= \
                -email-domain=* \
                -upstream=http://localhost:8080 \
                -scope=user:info \
                -pass-user-headers \
                -openshift-service-account=devspaces-multicluster-redirector \
                -client-id=system:serviceaccount:${NAMESPACE}:devspaces-multicluster-redirector \
                -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token \
                -cookie-secret-file=/etc/proxy/secrets/session_secret
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: session-secret
              mountPath: /etc/proxy/secrets
      volumes:
        - name: session-secret
          secret:
            secretName: devspaces-multicluster-redirector-session-secret
        - name: group-mapping
          configMap:
            name: devspaces-openshift-group-mapping
