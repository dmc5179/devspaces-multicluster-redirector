apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspaces-multicluster-redirector
  # REQUIRED: the overlay must add
  #   serviceaccounts.openshift.io/oauth-redirecturi.primary: "https://<route-host>/oauth/callback"
  # Without it the OAuth Proxy cannot complete the callback and login fails. It is
  # intentionally absent here because it must match Route.spec.host, which the base
  # does not set. See ../overlays/example-host-cluster/.
