apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redirector-review-creator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redirector-review-creator
subjects:
- kind: ServiceAccount
  name: devspaces-multicluster-redirector
  # namespace is deliberately omitted. Kustomize's namespace transformer only
  # rewrites a ServiceAccount subject namespace when it is absent or "default" —
  # a literal value here would survive the overlay's `namespace:` field and bind
  # to the wrong ServiceAccount, with Argo CD still reporting Synced/Healthy.